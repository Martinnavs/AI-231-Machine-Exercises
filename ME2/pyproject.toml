[project]
name = "me2-voicegen"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.3.1",
  "torchaudio==2.3.1",
  "transformers==4.51.3",
  "conformer==0.3.2",
  "diffusers==0.29.0",
  "lightning==2.2.4",
  "hyperpyyaml==1.2.3",
  "omegaconf==2.3.0",
  "hydra-core==1.3.2",
  "inflect==7.3.1",
  "librosa==0.10.2",
  "modelscope==1.20.0",
  "networkx==3.1",
  "numpy==1.26.4",
  "openai-whisper==20231117",
  "onnx==1.16.1",
  "onnxruntime==1.18.0",
  "protobuf==4.25",
  "pyarrow==18.1.0",
  "pydantic==2.7.0",
  "pyworld==0.3.4",
  "rich==13.7.1",
  "soundfile==0.12.1",
  "matplotlib==3.7.5",
  "wetext==0.0.4",
  "x-transformers==2.11.24",
  "einops",
  "setuptools<81",
  "gdown==5.1.0",
  "wget==3.2",
  # Re-added for the UI site (feature `ui-site`): the FastAPI dashboard + its
  # reverse dependency (the model-side forwarder's dev test client). This is a
  # deliberate, documented reversal of the original CosyVoice-spike exclusion
  # of `fastapi`/`uvicorn` ("webui/runtime-server only, unused") -- see the
  # README "Trimmed dependencies" table and feature-engineering/ui-site/SPEC.md.
  "fastapi==0.115.6",
  "uvicorn==0.30.6",
  # Plain `uvicorn` ships no WebSocket protocol implementation; `websockets`
  # provides it (the package `uvicorn[standard]` would add). Pinned 12.0:
  # uvicorn 0.30.x drives the legacy `websockets.legacy.server` API, which
  # newer major versions removed.
  "websockets==12.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  # FastAPI TestClient (starlette) requires httpx; also used by the UI's API
  # tests. Dev-only: the running server itself does not import httpx.
  "httpx==0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow",
]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `src/app` is the UI site (feature `ui-site`): a separate *service* (its own
# process) that shares this venv. It is packaged so `uv run uvicorn
# app.main:app` and `uv run python -m app.forward` can import it.
packages = ["src/me2_voicegen", "src/app"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchaudio = [{ index = "pytorch-cu121" }]

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]
